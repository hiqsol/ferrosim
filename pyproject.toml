[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c-ferrosim"
version = "0.1.0"
description = "A deterministic robot fleet simulation server for FMS integration tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.64",
    "protobuf>=5",
    "PyYAML>=5.4",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.64",
]

[project.scripts]
ferrosim-server = "ferrosim.server:main"

[tool.setuptools.packages.find]
include = ["ferrosim*"]
